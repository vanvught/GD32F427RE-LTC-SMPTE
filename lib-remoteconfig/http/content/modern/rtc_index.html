<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/styles.css">
<title>RTC</title>
</head>
<body>
<div id="appNav"></div>
<div id="appHeader"></div>
<div class="card">
  <h2>Real-time clock</h2>
  <div class="row"><label>Node time</label><span id="nodeTime"></span></div>
  <div class="row"><label>RTC time</label><span id="rtcTime"></span></div>
  <div class="row"><button onclick="refreshRtc()">Refresh</button></div>
  <div class="row"><button onclick="hcToSys()">Set Node time from RTC</button></div>
  <div class="row"><button onclick="sysToHc()">Set RTC from Node time</button></div>
</div>
<div class="card">
  <h2>RTC alarm</h2>
  <div class="row"><label for="alarmInput">Alarm</label><input type="datetime-local" id="alarmInput" step="1"></div>
  <div class="row checkbox"><label for="chkbox">Enabled</label><input type="checkbox" id="chkbox"></div>
  <div class="row"><button onclick="setRtcAlarm()">Set</button></div>
</div>
<div id="appFooter"></div>
<div id="appActions"></div>
<script src="/common.js"></script>
<script src="/layout.js"></script>
<script src="/date.js"></script>
<script src="/rtc/index.js"></script>
<script>bootPage('rtc'); list(); version(); refreshRtc();</script>
</body>
</html>
