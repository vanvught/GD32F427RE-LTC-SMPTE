<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="/styles.css" />
<title>Configuration</title>
</head>
<body>
	<div id="appNav"></div>
	<div id="appHeader"></div>
	<div class="card" id="ltcConfigCard">
		<h2>LTC Configuration</h2>
		<div class="row"><label for="ltc_source">Source</label><select id="ltc_source"></select></div>
		<table class="net-table ltc-table">
			<thead><tr><th>Output</th><th>Enabled</th><th>Disabled</th></tr></thead>
			<tbody id="ltc_outputs"></tbody>
		</table>
		<div class="ltc-actions"><span id="ltc_status" role="status" aria-live="polite"></span><button id="ltc_save" onclick="saveLtc()">Save</button></div>
	</div>
		<div class="card">
		<h2>Network</h2>
		<div class="row"><label>Hostname</label><input id="hostname" pattern="[A-Za-z0-9\-]{0,63}" maxlength="63"></div>
		<div class="row"><label>IP address</label><input id="ip_address" pattern="(\d{1,3}\.){3}\d{1,3}" required></div>
		<div class="row"><label>Netmask</label><input id="net_mask" pattern="(\d{1,3}\.){3}\d{1,3}" required></div>
		<div class="row"><label>Gateway</label><input id="default_gateway" pattern="(\d{1,3}\.){3}\d{1,3}" required></div>
		<div class="row"><label>NTP server</label><input id="ntp_server" pattern="(\d{1,3}\.){3}\d{1,3}"></div>
		<div class="row"><label>Secondary IP</label><input id="secondary_ip" disabled></div>
		<div class="row checkbox"><label></label><input type="checkbox" id="use_static_ip"><span>Use static IP</span><button onclick="saveNetwork()">Save</button></div>
	</div>
	<div id="appFooter"></div>
	<div id="appActions"></div>
	<script src="/common.js" type="text/javascript"></script>
	<script src="/layout.js" type="text/javascript"></script>
	<script src="/index.js" type="text/javascript"></script>
	<script>bootPage('config'); list(); version(); display(); loadLtc();</script>
</body>
</html>
